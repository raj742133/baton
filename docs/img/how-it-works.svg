<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">How Baton works</title>
  <desc id="d">You work in Claude. Baton hooks save BATON.md on every prompt and reply. In a new chat or account you drop the file. Claude locates the folder, verifies the live state and continues.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8a53a"/></marker>
    <style>
      .bg{fill:#12100c}.card{fill:#1a1712;stroke:#2d2820;stroke-width:1.5}.hot{stroke:#e8a53a}
      .n{fill:#e8a53a;font:600 13px ui-monospace,Consolas,monospace}
      .h{fill:#f3ece0;font:600 20px Georgia,serif}
      .p{fill:#a39a8a;font:14px system-ui,Segoe UI,sans-serif}
      .m{fill:#6fcf97;font:12px ui-monospace,Consolas,monospace}
      .ln{stroke:#e8a53a;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1200" height="440" rx="18"/>
  <text x="600" y="48" text-anchor="middle" class="h" style="font-size:26px">Work in one chat. Continue in any other.</text>

  <rect class="card" x="40" y="96" width="250" height="190" rx="14"/>
  <text x="62" y="130" class="n">1 · YOU WORK</text>
  <text x="62" y="162" class="h">Any project</text>
  <text x="62" y="190" class="p">Just use Claude as usual.</text>
  <text x="62" y="212" class="p">Nothing to remember,</text>
  <text x="62" y="234" class="p">nothing to type.</text>

  <rect class="card hot" x="335" y="96" width="250" height="190" rx="14"/>
  <text x="357" y="130" class="n">2 · BATON SAVES</text>
  <text x="357" y="162" class="h">On every event</text>
  <text x="357" y="190" class="p">Prompt, reply, compaction,</text>
  <text x="357" y="212" class="p">session end. Runs detached,</text>
  <text x="357" y="234" class="p">secrets redacted.</text>
  <text x="357" y="266" class="m">● saved rev 42 (Stop)</text>

  <rect class="card" x="630" y="96" width="250" height="190" rx="14"/>
  <text x="652" y="130" class="n">3 · ONE FILE</text>
  <text x="652" y="162" class="h">BATON.md</text>
  <text x="652" y="190" class="p">Path + fingerprint, goal,</text>
  <text x="652" y="212" class="p">decisions, next step, live</text>
  <text x="652" y="234" class="p">git state, recent chat.</text>
  <text x="652" y="266" class="m">copy · OneDrive · Drive</text>

  <rect class="card hot" x="925" y="96" width="235" height="190" rx="14"/>
  <text x="947" y="130" class="n">4 · NEW CHAT</text>
  <text x="947" y="162" class="h">Drop &amp; go</text>
  <text x="947" y="190" class="p">Other account, other PC.</text>
  <text x="947" y="212" class="p">Claude finds the folder,</text>
  <text x="947" y="234" class="p">verifies, continues.</text>

  <path class="ln" d="M292 191H331" marker-end="url(#a)"/>
  <path class="ln" d="M587 191H626" marker-end="url(#a)"/>
  <path class="ln" d="M882 191H921" marker-end="url(#a)"/>

  <rect class="card" x="40" y="316" width="1120" height="86" rx="14"/>
  <text x="62" y="350" class="n">LIVE VIEW</text>
  <text x="62" y="378" class="p">http://localhost:4747 starts with every Claude session: watch each save land, copy the whole file, or store it in OneDrive, Dropbox or Google Drive.</text>
</svg>
